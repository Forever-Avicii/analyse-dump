[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse-dump"
version = "0.1.0"
description = "Offline heap dump importers for HPROF and V8/ArkTS heapsnapshot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "ijson>=3.2",
]

[project.scripts]
analyse-dump = "analyse_dump.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analyse_dump = ["sql/*.sql"]
